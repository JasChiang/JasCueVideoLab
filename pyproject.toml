[project]
name = "montagewright"
version = "0.1.0"
description = "Rushes to a finished cut, with every decision on the record"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116.0,<1",
  "google-genai>=2.12.1,<2.13",
  "pillow>=11.3.0,<12",
  "pydantic>=2.11.0,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9",
]

[project.scripts]
montagewright = "montagewright.cli:main"
montagewright-web = "montagewright.webapp:main"

[project.optional-dependencies]
tracking = [
    "opencv-contrib-python-headless>=5.0.0.93",
]
segmentation = [
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/montagewright", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
